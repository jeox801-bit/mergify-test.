merge_queue:
  max_parallel_checks: 1
queue_rules:
  - name: default
    merge_conditions:
      - -draft

queue_rules:
  - name: hotfix
    queue_conditions:
      - label = hotfix
    merge_conditions:
      - -draft
  - name: default-attack
    queue_conditions:
      - -label = hotfix
    merge_conditions:
      - -draft